name: Docs Claims

# Capability-manifest gate. config/capabilities.toml is the single source of truth
# for cross-surface claims (IR versions, autodiff status, runtime boundary, declared
# counts); scripts/check_claims.py fails the build if any public surface drifts from
# it — including re-deriving the declared [counts] from the real tree.
#
# Runs on its OWN triggers (NOT the main ci.yml matrix) because ci.yml has
# paths-ignore: ['**.md', 'docs/**'] — a docs-only drift would otherwise slip through.
#
# DELIBERATELY UNFILTERED (no `paths:`). Every gate below inspects the WHOLE
# tracked tree — check_claims.py re-derives counts from the real tree, and both
# hygiene scripts are a `git grep` over all tracked files — so their verdict does
# not depend on which files a push happened to touch. A `paths:` filter on a
# whole-tree invariant can therefore only ever suppress a real failure; it can
# never make the answer more correct.
#
# It previously carried paths: ['**.md', ...] while check_no_ai_attribution.sh
# scans .md/.rs/.py/.mind/.sh/.toml/.rst/.txt. Consequence: an AI-attribution
# landing in ANY source file never started this workflow, and
# check_json_not_evidence.sh — which scans only *.mind — could never fire at all,
# because no *.mind path could match the filter. On a PUBLIC repo, with the local
# pre-commit hook being opt-in, that left no enforcement whatsoever.
#
# The fix is removal, not a wider list: a filter enumerating extensions is a
# second copy of the scan scope that drifts the moment either side changes.
# scripts/check_gate_wiring.py (run as the first step below) fails the build if a
# filter is reintroduced or a gate is unwired. The whole job is ~1s of work.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-claims:
    name: Docs claims gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the commit-message gate below reads `git log` over the
          # pushed range, and the default shallow clone (depth 1) cannot resolve
          # a range at all — it would fail closed on every run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # tomllib is stdlib from 3.11+

      - name: Gate wiring (these gates must be reachable at all)
        run: python3 scripts/check_gate_wiring.py

      - name: Gate-wiring lint must fail CLOSED on a deleted gate step
        # scripts/test_gate_wiring.py mutates a scratch copy of the wiring and
        # asserts the lint above goes RED for each: the commit-message step
        # deleted, a gate named only in a comment, the docs-claims row removed
        # from .github/required-ci-jobs.tsv, a manifest job id that no longer
        # exists, and a hook missing from .githooks. A lint no mutation can
        # redden is not gating anything, and this job is where that is proved.
        run: python3 scripts/test_gate_wiring.py

      - name: Check claims against capability manifest
        run: python3 scripts/check_claims.py

      - name: No AI-attribution in public artifacts
        run: bash scripts/check_no_ai_attribution.sh

      - name: JSON is never an evidence-hash preimage (wedge integrity)
        run: bash scripts/check_json_not_evidence.sh

      - name: No model/tool credit in commit MESSAGES (history is permanent)
        # Companion to the file gate above, sharing ONE pattern definition
        # (scripts/ai_attribution_patterns.sh) so the two cannot drift. It lives
        # in THIS job deliberately: adding a step to an already-required job keeps
        # .github/required-ci-jobs.tsv correct, whereas a new job would need a row
        # there or it would be advisory-only (verify with
        # python3 scripts/check_release_gating.py).
        #
        # Until this existed, commit messages were checked by NOTHING — no
        # commit-msg hook, no CI step reading git log — so the same credit the
        # file gate rejects in a comment could enter a PUBLIC repo's permanent
        # history in the message beside it. A file can be fixed by the next
        # commit; a message cannot be fixed without rewriting every descendant.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request)
              git fetch --no-tags --quiet origin "$BASE_REF" 2>/dev/null || true
              RANGE="origin/${BASE_REF}..HEAD"
              ;;
            push)
              # A brand-new branch (or a force-push whose before-sha no longer
              # exists) reports the all-zero before-sha; a range built from it
              # cannot resolve, so fall back to the branch-point against main.
              if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zero" ] \
                 || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                RANGE="origin/main..HEAD"
                # On a push to main that fallback is EMPTY (origin/main is the
                # pushed tip), and an empty range asserts nothing. Scan the
                # pushed commit itself instead rather than report a vacuous pass.
                if [ "$(git rev-list --count "$RANGE" 2>/dev/null || echo 0)" = 0 ]; then
                  RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
                fi
              else
                RANGE="${BEFORE}..${HEAD_SHA}"
              fi
              ;;
            *)
              # workflow_dispatch (and any other trigger): against main this range is
              # always empty, which would be a permanently vacuous pass. Fall back to the
              # commit under test exactly as the push arm does.
              RANGE="origin/main..HEAD"
              if [ "$(git rev-list --count "$RANGE" 2>/dev/null || echo 0)" = 0 ]; then
                RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
              fi
              ;;
          esac
          echo "event=$EVENT range=$RANGE"
          bash scripts/check_commit_messages.sh "$RANGE"

      - name: Release gating contract (release.yml may only publish CI-green commits)
        # Whole-tree invariant like the two above, and it belongs on THIS
        # workflow's unfiltered trigger for the same reason: the contract spans
        # release.yml + ci.yml + .github/required-ci-jobs.tsv, so a change to any
        # one of them — including a docs-only commit that ci.yml's paths-ignore
        # would skip — can break it. Pure text analysis, no build artifacts.
        run: python3 scripts/check_release_gating.py
